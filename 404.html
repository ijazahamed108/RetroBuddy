<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Game over — RetroBuddy</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #f2f0ff; background: radial-gradient(700px 400px at 50% 20%, rgba(255, 62, 138, 0.2), transparent), #0d0b1e;
    }
    h1 { font-family: ui-monospace, Menlo, monospace; font-size: clamp(32px, 8vw, 64px); letter-spacing: 4px; margin: 0 0 12px; text-shadow: 4px 4px 0 #ff3e8a; }
    p { color: #a9a3d6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 12px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(135deg, #ff3e8a, #b43cff); }
  </style>
</head>
<body>
  <main>
    <h1>GAME OVER</h1>
    <p>This page doesn’t exist. Insert coin to continue.</p>
    <a id="home" href="/">Back to the library</a>
  </main>
  <script>
    // On GitHub Pages project sites the app lives under /<repo>/, not the domain root.
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
